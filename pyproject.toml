[project]
name = "signalpost-agent"
version = "0.1.0"
description = "Evidence-first research agent for Norwegian companies (Builderr Signalpost challenge)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
signalpost = "signalpost.cli:main"

[build-system]
requires = ["setuptools>=68"]
